# Pfad im Repo: .github/workflows/snake.yml
# Rendert den Contribution-Graph als animiertes SVG und pusht
# das Ergebnis in einen Branch namens "output".

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # alle 12 Stunden
  workflow_dispatch: # Button zum manuellen Starten im Actions-Tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # noetig zum Pushen des output-Branch

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # zurueckhaltende Graustufen, ein dezenter Blauton fuer die Snake
          outputs: |
            dist/snake.svg?color_snake=#57606A&color_dots=#EBEDF0,#D0D7DE,#AFB8C1,#8C959F,#6E7781
            dist/snake-dark.svg?color_snake=#58A6FF&color_dots=#161B22,#21262D,#30363D,#484F58,#6E7681

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
